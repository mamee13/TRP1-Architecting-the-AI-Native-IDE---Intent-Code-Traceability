- id: "INTENT-001"
  description: "Initialize the project's orchestration layer and reasoning loop."
  status: "active"
  owned_scope:
      - ".orchestration/*"
      - "src/core/tools/*"
      - "src/core/prompts/*"
  constraints:
      - "Must not use external libraries for hashing."
      - "Must follow the Interceptor Pattern for hooks."
  acceptance_criteria:
      - "select_active_intent tool is functional."
      - "System prompt reflects active intent."
- id: "TEST-001"
  description: "Playground intent for testing the governed reasoning loop."
  status: "IN_PROGRESS"
  owned_scope:
      - "test/*"
      - "README.md"
      - "CLAUDE.md"
  constraints:
      - "Keep changes minimal."
      - "Observe the Agent Trace output."
  acceptance_criteria:
      - "Successfully edit a file in test/."
      - "Observe entry in agent_trace.jsonl."
- id: "INTENT-002"
  description: "Create a JavaScript file that prints 'Hello World' to the console."
  status: "active"
  owned_scope:
      - "hello.js"
  constraints:
      - "Use standard console.log."
  acceptance_criteria:
      - "File 'hello.js' exists and contains console.log('Hello World')."
- id: "NODE-BOOT-001"
  description: "Bootstrap a new Node.js project with Express and TypeScript."
  status: "IN_PROGRESS"
  owned_scope:
      - "package.json"
  constraints:
      - "Must use npm init -y."
      - "Must install express and typescript."
  acceptance_criteria:
      - "package.json is created."
      - "node_modules exists."
- id: "NODE-MID-002"
  description: "Implement a logging middleware to verify Scope Enforcement."
  status: "IN_PROGRESS"
  owned_scope:
      - "src/middleware/**"
  constraints:
      - "Must only edit files in src/middleware/."
  acceptance_criteria:
      - "Middleware exists."
- id: "NODE-FINAL-003"
  description: "Assemble the final app to verify Optimistic Locking."
  status: "IN_PROGRESS"
  owned_scope:
      - "*"
  constraints:
      - "Finalize server.ts."
  acceptance_criteria:
      - "Server starts successfully."
